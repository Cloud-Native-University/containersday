params:
    images:
        - logos/logo-containersday-v2.png
    themes:
        event:
            description: 'Containers Day 2026 — la conferencia Cloud Native más importante del Caribe. IA, contenedores, Kubernetes y más en Santiago, RD. 22 de agosto de 2026.'
            title: 'Containers Day'
            slogan: '¡La conferencia tecnológica más importante del Caribe!'
            location: 'UAPA, Santiago'
            contactEmail: 'hola@containers.day'
            volunteersFormUrl: 'https://forms.gle/gcxikdvi2irEFKPWA'
            favicon: 'logos/logo-containersday-v2.png'
            startDate: '2026-08-22'
            endDate: '2026-08-22'
            # Local clock for the countdowns. endTime is when the countdown
            # retires and the thank-you message takes over.
            startTime: '09:00'
            endTime: '23:59'
            utcOffset: '-04:00'
            address:
                - 'Av. Hispanoamericana #100, Thomén'
                - 'Santiago de los Caballeros'
                - '51000, República Dominicana'
            map:
                embeddableMapUrl: 'https://www.google.com/maps?q=Av.+Hispanoamericana+%23100,+Thom%C3%A9n,+51000+Santiago+de+los+Caballeros,+Rep%C3%BAblica+Dominicana&output=embed'
                viewLargerMapUrl: 'https://www.google.com/maps/dir/?api=1&destination=Av.+Hispanoamericana+%23100,+Thom%C3%A9n,+51000+Santiago+de+los+Caballeros,+Rep%C3%BAblica+Dominicana'
            sessionizeId: 'hnm5gsws'
            # Sessionize sends no categories, so session type is matched on the
            # title. Lowercase substrings; first list that matches wins.
            sessionTypes:
                panel: ['panel']
                keynote: ['keynote', 'charla magistral', 'conferencia magistral']
            # Which floor of the building a room is on. Sessionize sends the
            # room name but never says where the room is, and the parallel
            # tracks run on two different floors — attendees move between them
            # between talks, so the floor belongs on the card next to the room.
            # Keyed by the exact room name in the feed; a room that is not
            # listed simply gets no pill.
            roomFloors:
                # Only sessions starting at or after this local time carry the
                # pill. The Octagonal rooms hold nothing but registration in the
                # morning, which is staffed and signposted at the door.
                from: '13:00'
                # `color` is the room's signage colour and `text` rides along
                # with it, because a chip that sets a background must set its
                # own foreground — see the contrast rule in AGENTS.md. These
                # three are darkened from the flat brand colours so white text
                # clears 4.5:1 on them.
                rooms:
                    - name: 'Octagonal 1'
                      floor: '4'
                      color: '#c2410c'
                      text: '#ffffff'
                    - name: 'Octagonal 2'
                      floor: '5'
                      color: '#111928'
                      text: '#ffffff'
                    - name: 'Octagonal 3'
                      floor: '5'
                      color: '#1d4ed8'
                      text: '#ffffff'
            callToAction:
                url: 'https://cap.uapa.edu.do/producto/containers-day-2026/'
                other:
                    url: 'https://cap.uapa.edu.do/producto/containers-day-2026/'
            # CFP closed: leave `url` empty to hide every "Ser Orador" CTA and the CFP banner.
            # Restore the URL to reopen it.
            callToActionSecondary:
                url: ''
                label: 'Ser Orador'
            socialLinks:
                xUrl: https://x.com/containerslatam
                facebookUrl: https://www.facebook.com/containersday
                linkedinUrl: https://www.linkedin.com/company/containersday-dr
            images:
                logo: logos/logo-containersday-v2.png
                titleBackground: images/hero-background-v2.jpg
                location: images/uapa-campus.jpg
            heroSlides:
                - title: 'Orquestando el Mañana'
                  subtitle: 'Innovación'
                  description: 'IA + Cloud Native'
                  image: images/hero-background-v2.jpg
                - title: 'Infraestructura Inteligente'
                  subtitle: 'Escalabilidad'
                  description: 'Modelos de IA'
                  image: images/hero-background-v3.jpg
                - title: 'El Motor de la Innovación'
                  subtitle: 'Tecnología'
                  description: 'Contenedores e IA'
                  image: images/hero-background-v4.png
                - title: 'Modernización Blindada'
                  subtitle: 'Seguridad'
                  description: 'Arquitecturas Cloud Native'
                  image: images/hero-background-v5.png
                - title: 'Más allá de la Nube'
                  subtitle: 'Rendimiento'
                  description: 'Escalabilidad y Seguridad'
                  image: images/hero-background-v2.jpg
            sponsorTiers:
                platinum:
                    label: '🏆 Patrocinador Platinum'
                    color: '#cfe0f5'
                gold:
                    label: '🥇 Patrocinador Oro'
                    color: '#f59e0b'
                silver:
                    label: '🥈 Patrocinador Plata'
                    color: '#8899aa'
                community:
                    label: '🤝 Patrocinador Comunitario'
                    color: '#5dade2'
            initiativePartners:
                - logo: '/logos/organizers/scale2connect-v3.png'
                  url: 'https://scale2connect.eu/'
                  name: 'Scale2Connect'
                - logo: '/logos/organizers/eu-flag-v1.png'
                  url: 'https://cordis.europa.eu/project/id/101214553'
                  name: 'Funded by the European Union'
                  wide: true
                - logo: '/logos/organizers/cadesoft-color.png'
                  url: 'https://cadesoft.do/'
                  name: 'CADESOFT'
                - logo: '/logos/organizers/mente-de-hackers.png'
                  url: 'https://www.instagram.com/mentedehackers/?hl=en'
                  name: 'Mente de Hackers'
            colors:
                primary: '#5dade2'
                primaryDarker: '#143e8b'
            redirectBasedOnBrowserLang: false

markup:
    goldmark:
        renderer:
            unsafe: true
