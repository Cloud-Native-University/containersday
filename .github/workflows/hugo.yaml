# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
    # Runs on pushes
    push:

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    # Poll Sessionize. It has no webhooks, so polling is the only way to pick up
    # schedule changes. The check job below skips the build when nothing moved.
    #
    # GitHub throttles scheduled workflows and silently drops runs under load —
    # on the 2026 event day the */15 line actually fired every 25–56 minutes. So
    # the event day gets a denser schedule to raise the odds of landing inside a
    # 15 minute window, and a real cron on an organizer machine drives the sync
    # for that day (see the "Sessionize sync" section of AGENTS.md). Neither can
    # cause a redundant deploy: the check job hashes the feeds first.
    schedule:
        - cron: '*/15 * * * *'
        # Event day only (22 August, 11:00–23:59 UTC = 07:00–19:59 in Santo
        # Domingo). Update the day/month when the event moves; it is a no-op on
        # every other date.
        - cron: '*/5 11-23 22 8 *'

env:
    # Keep in sync with params.themes.event.sessionizeId in hugo.yaml.
    SESSIONIZE_ID: hnm5gsws

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

# Default to bash
defaults:
    run:
        shell: bash

jobs:
    # Is there anything new in Sessionize? Hash the two feeds the site renders and
    # compare against the payload the last successful deploy published. No checkout,
    # no Hugo — an unchanged schedule costs a couple of seconds.
    check:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.decide.outputs.changed }}
            digest: ${{ steps.digest.outputs.digest }}
        steps:
            - name: Hash the Sessionize feeds
              id: digest
              run: |
                  set -euo pipefail
                  base="https://sessionize.com/api/v2/${SESSIONIZE_ID}/view"
                  curl -fsS "$base/GridSmart" > grid.json
                  curl -fsS "$base/all" > all.json
                  digest=$(cat grid.json all.json | sha256sum | cut -d' ' -f1)
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"

            - name: Look for a build that already published this payload
              id: cache
              uses: actions/cache/restore@v4
              with:
                  path: .sessionize-digest
                  key: sessionize-${{ steps.digest.outputs.digest }}
                  lookup-only: true

            - name: Decide whether to build
              id: decide
              run: |
                  # Only scheduled polls are allowed to skip; a push or a manual run
                  # always deploys, since the change may be in the templates.
                  if [ "${{ github.event_name }}" != "schedule" ]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "Sessionize unchanged since the last deploy, skipping." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

    # Build job
    build:
        needs: check
        if: needs.check.outputs.changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Install Hugo CLI
              run: make install
            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5
            - name: Build with Hugo
              env:
                  TZ: America/Santo_Domingo
              run: make build BASE_URL="${{ steps.pages.outputs.base_url }}/"
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: [check, build]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            # Recorded only after a successful deploy, so a failed build is retried
            # on the next poll instead of being suppressed by its own digest.
            - name: Record the published payload
              run: echo "${{ needs.check.outputs.digest }}" > .sessionize-digest
            - uses: actions/cache/save@v4
              with:
                  path: .sessionize-digest
                  key: sessionize-${{ needs.check.outputs.digest }}
