# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
    # Runs on pushes
    push:

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    # Poll Sessionize. It has no webhooks, so polling is the only way to pick up
    # schedule changes. The check job below skips the build when nothing moved.
    #
    # Two schedules, because GitHub throttles scheduled workflows and silently
    # drops runs under load — on the 2026 event day the */15 line actually fired
    # every 25–56 minutes. The dense one exists to shorten that wait while the
    # event is running. It is odds, not a guarantee: for an immediate publish,
    # dispatch the workflow by hand (see "Sessionize sync" in AGENTS.md).
    #
    # A cron expression cannot read site config, so the dense schedule runs
    # year-round and the *event day itself* is decided at run time from
    # params.themes.event in hugo.yaml (see the `window` step below). Off-day
    # dense ticks exit in seconds without touching Sessionize; move the event in
    # hugo.yaml and the dense window follows, with nothing to edit here.
    schedule:
        - cron: '*/15 * * * *'
        - cron: '*/5 * * * *'

env:
    # Keep in sync with params.themes.event.sessionizeId in hugo.yaml.
    SESSIONIZE_ID: hnm5gsws

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

# Default to bash
defaults:
    run:
        shell: bash

jobs:
    # Is there anything new in Sessionize? Hash the two feeds the site renders and
    # compare against the payload the last successful deploy published. No checkout,
    # no Hugo — an unchanged schedule costs a couple of seconds.
    check:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.decide.outputs.changed }}
            digest: ${{ steps.digest.outputs.digest }}
        steps:
            # hugo.yaml only, so this stays a couple-of-seconds job.
            - name: Check out the site config
              uses: actions/checkout@v4
              with:
                  sparse-checkout: hugo.yaml
                  sparse-checkout-cone-mode: false

            # Is today the event day? Read it from the same params the countdowns
            # and the agenda read, so the dense poll window moves when the event
            # moves and no date is written down twice.
            - name: Read the event window from hugo.yaml
              id: window
              run: bash .github/scripts/event-window.sh
              env:
                  DENSE_CRON: '*/5 * * * *'
                  EVENT_SCHEDULE: ${{ github.event.schedule }}
                  EVENT_NAME: ${{ github.event_name }}

            - name: Hash the Sessionize feeds
              id: digest
              if: steps.window.outputs.active == 'true'
              run: |
                  set -euo pipefail
                  base="https://sessionize.com/api/v2/${SESSIONIZE_ID}/view"
                  curl -fsS "$base/GridSmart" > grid.json
                  curl -fsS "$base/all" > all.json
                  digest=$(cat grid.json all.json | sha256sum | cut -d' ' -f1)
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"

            - name: Look for a build that already published this payload
              id: cache
              if: steps.window.outputs.active == 'true'
              uses: actions/cache/restore@v4
              with:
                  path: .sessionize-digest
                  key: sessionize-${{ steps.digest.outputs.digest }}
                  lookup-only: true

            - name: Decide whether to build
              id: decide
              run: |
                  # Only scheduled polls are allowed to skip; a push or a manual run
                  # always deploys, since the change may be in the templates.
                  if [ "${{ github.event_name }}" != "schedule" ]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  elif [ "${{ steps.window.outputs.active }}" != "true" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "Sessionize unchanged since the last deploy, skipping." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

    # Build job
    build:
        needs: check
        if: needs.check.outputs.changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Install Hugo CLI
              run: make install
            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5
            - name: Build with Hugo
              env:
                  TZ: America/Santo_Domingo
              run: make build BASE_URL="${{ steps.pages.outputs.base_url }}/"
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: [check, build]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            # Recorded only after a successful deploy, so a failed build is retried
            # on the next poll instead of being suppressed by its own digest.
            - name: Record the published payload
              run: echo "${{ needs.check.outputs.digest }}" > .sessionize-digest
            - uses: actions/cache/save@v4
              with:
                  path: .sessionize-digest
                  key: sessionize-${{ needs.check.outputs.digest }}
